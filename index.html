<head>

<meta name="description" content="Chiara and Adji invite you to celebrate their wedding. Saturday, 19 December 2026, Cepu.">

<meta property="og:type" content="website">
<meta property="og:title" content="Chiara &amp; Adji · Wedding Invitation">

<meta property="og:image" content="assets/og-image.jpg"><!-- 1200x630; use absolute URL once deployed -->

<link rel="stylesheet" href="css/styles.css?v=15">

<body class="locked">
<a class="skip" href="#main">Skip to content</a>

<!-- 1. Opening envelope -->
<section id="opening" class="opening dark" aria-label="Invitation envelope">
  <div class="deco" id="deco" aria-hidden="true"></div>
  <div id="lang-open"></div>
  <div class="env2" id="envelope">
    <img class="e-back" src="assets/art/env-back.webp" alt="" onerror="this.style.display='none'">
    <div class="e-card"><p class="eyebrow" id="open-wo"></p><p class="script" id="open-invite"></p><p class="meta e-date" id="open-date"></p></div>
    <img class="e-front" src="assets/art/env-front.webp" alt="" onerror="this.style.display='none'">
    <div class="e-to"><p class="eyebrow" id="open-to"></p><p class="script" id="open-guest"></p></div>
    <button class="seal" id="seal" type="button" aria-label="Open invitation"><img src="assets/art/seal.webp" alt="" onerror="this.style.display='none'"><span id="seal-mono"></span></button>
    <img class="env-tag" src="assets/art/tag.webp" alt="" onerror="this.style.display='none'">
  </div>
  <p class="hint" id="open-hint"></p>
</section>

<!-- Desktop-only side panel (hidden on phones) -->
<aside class="side dark" aria-hidden="true"><div class="side-in" data-parallax></div></aside>

<header class="topbar" id="topbar"><span id="lang-top"></span><a href="#rsvp">RSVP</a></header>
<main id="main"><noscript><p style="padding:2rem">Please enable JavaScript to view this invitation.</p></noscript></main>

<button class="music" id="music" type="button" aria-pressed="false" aria-label="Play music" hidden>
  <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>
<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <button class="lb-x" aria-label="Close">×</button>
  <button class="lb-n lb-prev" aria-label="Previous photo">‹</button>
  <img alt=""><button class="lb-n lb-next" aria-label="Next photo">›</button>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data/content.js?v=15"></script>
<script src="js/art.js?v=15"></script>
<script src="js/app.js?v=15"></script>
</body>
</html>
